  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: The Mythic Dawn have been searching for a secret chamber within an Ayleid ruin that may contain a Great Welkynd Stone. I found four Ayleid Elemental Shards that may help me gain access to this chamber. I should return them to their holders.
- Index: 101
