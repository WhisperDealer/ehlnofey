    Entry:
      TargetLanguage: English
      Value: I placed the four Ayleid Elemental Shards in their holders, and a passage to a hidden chamber opened. I should investigate and see if I can locate the Great Welkynd Stone.
- Index: 120
  LogEntries:
  - Flags: []
- Index: 130
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I gained access to the secret chamber within Rielle and retrieved the Great Welkynd Stone, but was ambushed by an Ayleid Lich. I need to defeat him in order to escape.
- Index: 140
  LogEntries:
  - Flags: []
- Index: 150
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I found and retrieved the Great Welkynd Stone from within Rielle, and defeated the Ayleid Lich guardian, but the Mythic Dawn will stop at nothing to bring Mehrunes Dagon into power. I should search for any clues nearby that might lead me to the location of the Oblivion Gate.
- Index: 160
  Unknown: 40
  LogEntries:
  - Flags: []
- Index: 165
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: While searching for clues about the Mythic Dawn's whereabouts I found a journal on a dead Vigilant of Stendarr. They learned of the Mythic Dawn's plot by capturing and interrogating a priest, and were able to decipher the location of the Oblivion Gate. I should go there and see if I can get inside. Wearing a set of Mythic Dawn robes might make it easier, but I need to be careful.
- Index: 170
  LogEntries:
  - Flags: []
    Entry:
      TargetLanguage: English
      Value: I've found the repaired Oblivion Gate deep inside Red Scar Cavern, the Mythic Dawn hideout. The leader of the Mythic Dawn, Vonos, will stop at nothing to bring Mehrunes Dagon to power, and must be defeated.
